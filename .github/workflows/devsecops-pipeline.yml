name: DevSecOps Pipeline
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o cyclonedx-json > sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - name: Run Semgrep
        continue-on-error: true
        run: semgrep --config auto --json --output semgrep-results.json .
      - name: Show human-readable results
        run: semgrep --config auto . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.json

  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit
      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -f json -o sca-results.json
      - name: Show human-readable results
        run: pip-audit -r requirements.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: sca-results.json

  container-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carbon-platform:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'carbon-platform:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          trivyignores: '.trivyignore'
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - name: Run tests
        run: python -m pytest --cov=. --cov-report=term --cov-fail-under=5
        env:
          PYTHONPATH: .
          LOG_DIR: ./logs

  deploy:
    needs: [sast, sca, container-scan, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy step — promote scan jobs to blocking once findings are triaged"
